<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentOS — Legal &amp; Policy Portal</title>
  <style>
    :root {
      --bg: #FAF9F5;
      --surface: #FFFFFF;
      --text: #141413;
      --text-muted: #5E5D59;
      --line: #E8E6DC;
      --accent: #C96442;
      --accent-hover: #A94E33;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --surface: #1A1917;
        --text: #F5F4ED;
        --text-muted: #B5B2A8;
        --line: #2C2B27;
        --accent: #D97757;
        --accent-hover: #E2886A;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1.75rem;
      padding: 2.75rem 2.25rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }
    .icon {
      width: 56px;
      height: 56px;
      background: rgba(201, 100, 66, 0.12);
      color: var(--accent);
      border-radius: 1.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.95rem 1.5rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(201, 100, 66, 0.3);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.04);
      border-color: var(--text-muted);
      transform: translateY(-1px);
    }
    .footer {
      margin-top: 1.75rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <!-- Graduation Cap / Shield Icon -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>StudentOS Legal Portal</h1>
    <p>Official legal documentation, user data policies, and terms of service for StudentOS (Student Command Center).</p>

    <div class="button-group">
      <!-- Button 1: Privacy Policy -->
      <a href="https://sutdent-command-center.vercel.app/privacy" target="_blank" rel="noopener noreferrer" class="btn btn-primary" onclick="return navigateSafely(event, this.href)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Privacy Policy</span>
      </a>

      <!-- Button 2: Terms of Service -->
      <a href="https://sutdent-command-center.vercel.app/terms" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" onclick="return navigateSafely(event, this.href)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span>Terms of Service</span>
      </a>
    </div>

    <div class="footer">
      StudentOS is MIT Licensed • <a href="https://sutdent-command-center.vercel.app" target="_blank" rel="noopener noreferrer">Open Main App</a>
    </div>
  </div>

  <script>
    function navigateSafely(e, url) {
      try {
        // In some iframe setups, top navigation is allowed
        if (window.top && window.top !== window && window.top.location) {
          window.top.location.href = url;
          if (e && e.preventDefault) e.preventDefault();
          return false;
        }
      } catch (err) {
        // Cross-origin sandboxed iframe (like Google Sites) blocks window.top.
        // Fall back to opening in a new tab via window.open / default target="_blank".
      }
      // Let standard <a target="_blank"> open the link reliably
      return true;
    }
  </script>
</body>
</html>
